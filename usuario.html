<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Usuario — SmartPark ST</title>
  <link rel="stylesheet" href="usuario.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Topbar limpia -->
    <header class="topbar">
      <a href="index.html" class="icon-btn" aria-label="Volver al inicio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>

      <h1 class="topbar-title" id="topbarTitle">Iniciar Sesión</h1>

      <button type="button" id="btnLogout" class="icon-btn hidden" onclick="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
      <div id="topbarSpacer" class="topbar-spacer"></div>
    </header>

    <!-- PANTALLA DE LOGIN -->
    <main id="loginView" class="login-container">
      <section class="login-card">
        <div class="login-logo">P</div>
        <h2>SmartPark ST</h2>
        <p class="login-sub">Ingresa con tu correo institucional</p>

        <form onsubmit="handleLogin(event)" class="login-form">
          <label class="field">
            <span>Correo institucional</span>
            <input type="email" id="loginEmail" required placeholder="usuario@santotomas.cl" autocomplete="email" />
          </label>

          <label class="field">
            <span>Contraseña</span>
            <input type="password" id="loginPass" required placeholder="•••••" autocomplete="current-password" />
          </label>

          <p id="loginError" class="login-error hidden"></p>

          <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <div class="demo-accounts">
          <span>Cuentas de prueba (clave: <strong>12345</strong>)</span>
          <div class="demo-btns">
            <button type="button" onclick="quickLogin('alumno.demo@alumnos.santotomas.cl')">🎓 Alumno</button>
            <button type="button" onclick="quickLogin('carolina.munoz@santotomas.cl')">👨‍🏫 Docente</button>
            <button type="button" onclick="quickLogin('roberto.soto@santotomas.cl')">⭐ Jefe Carrera</button>
          </div>
        </div>
      </section>
    </main>

    <main id="appView" class="main-content hidden">
      <!-- 1. ARRIBA: Tarjeta Credencial QR (tocar para agrandar) -->
      <section class="qr-card">
        <div class="user-info-top">
          <div>
            <h2 id="userName">Cargando...</h2>
            <span class="user-sub" id="userSub">RUT: --</span>
          </div>
          <span class="role-pill" id="userRolePill">--</span>
        </div>

        <button type="button" class="qr-box" onclick="openQrZoom()" aria-label="Agrandar código QR">
          <div id="qrContainer" class="qr-render"></div>
          <div class="qr-timer-wrap">
            <div class="qr-timer-track"><div id="qrTimerBar" class="qr-timer-fill"></div></div>
            <span class="qr-timer-text" id="qrTimerText">QR dinámico · 60s</span>
          </div>
          <span class="qr-tap-hint">Toca el QR para agrandar</span>
        </button>
      </section>

      <!-- 2. ABAJO: Aforo en Tiempo Real (sin contar área de jefatura) -->
      <section class="aforo-card">
        <span class="aforo-label">Disponibilidad en Vivo</span>
        <div class="aforo-free-big" id="freeSpotsBig">--</div>
        <span class="aforo-free-sub" id="freeSpotsLabel">Conectando...</span>

        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <span class="aforo-detail" id="aforoDetail">Ocupados: -- / --</span>
      </section>

      <!-- Banner exclusivo Docentes (oculto para alumnos) -->
      <section id="docenteAreaCard" class="area-card hidden">
        <div class="area-badge">⭐ Exclusivo Docentes · <span id="docenteAreaName"></span></div>
        <p id="docenteAreaMsg"></p>
      </section>

      <!-- Panel exclusivo Jefe de Carrera (oculto para alumnos) -->
      <section id="jefeCard" class="jefe-card hidden">
        <span class="jefe-tag">⭐ Jefe de Carrera · <span id="jefeAreaName"></span></span>
        <h2>Mi Estacionamiento Reservado</h2>
        <p class="jefe-desc" id="jefeStatusDesc"></p>
        <button id="btnToggleJefe" class="btn-jefe" onclick="toggleJefeSpot()">
          Liberar mi espacio hoy
        </button>
      </section>
    </main>
  </div>

  <!-- MODAL QR EN GRANDE (al presionar el QR) -->
  <div id="qrZoomModal" class="qr-zoom-backdrop hidden" onclick="closeQrZoom()" role="dialog" aria-modal="true">
    <div class="qr-zoom-sheet" onclick="event.stopPropagation()">
      <div id="qrZoomContainer" class="qr-zoom-render"></div>
      <p class="qr-zoom-name" id="qrZoomName"></p>
      <span class="qr-timer-text" id="qrZoomTimerText">Actualiza en 60s</span>
      <button type="button" class="btn-close-zoom" onclick="closeQrZoom()">Cerrar</button>
    </div>
  </div>

  <script type="module" src="usuario.js"></script>
</body>
</html>
